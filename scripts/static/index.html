<body>
<header><h1>PixelRAG</h1><span>Znajdź odpowiedź i sprawdź ją w dokumencie.</span><button type="button" id="newChat">Nowa rozmowa</button></header>
<main>
<section id="chat" aria-label="Pytania do dokumentów">
<div id="log"><div class="empty" id="welcome"><strong>O co chcesz zapytać?</strong>Wpisz pytanie lub dodaj zrzut ekranu. Zobaczysz znalezione strony i odpowiedź Gemini ze źródłami.</div></div>
<form id="composer">

<textarea id="q" placeholder="Np. jakie parametry ma ten produkt?" maxlength="4000"></textarea>
<div id="attachment" hidden><img id="attachmentPreview" alt="Załączony obraz"><span id="attachmentName"></span><button type="button" id="clearImage">Usuń obraz</button></div>
<div class="actions"><label class="upload">Dodaj obraz<input id="queryImage" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Dodaj obraz PNG, JPEG lub WebP"></label><span class="muted">do 5 MB</span><button id="cancelAsk" type="button" hidden>Anuluj</button><button id="send" type="submit">Zapytaj</button></div>
<div id="formStatus" role="status" aria-live="polite"></div>
</form>
</section>
<section id="viewer" aria-label="Podgląd dokumentu PDF">
<div class="viewer-tools"><select id="docSel" aria-label="Dokument" disabled><option>Ładowanie dokumentów…</option></select><button id="prevPage" type="button" aria-label="Poprzednia strona" disabled>←</button><label for="pgNum">Strona</label><input id="pgNum" type="number" min="1" value="1" aria-label="Numer strony" disabled><span id="pageCount">/ —</span><button id="nextPage" type="button" aria-label="Następna strona" disabled>→</button><a id="openPdf" target="_blank" rel="noopener" hidden>Otwórz PDF</a></div>
<div id="pdfArea"><p id="viewerStatus" role="status">Ładowanie dokumentów…</p><p id="highlightQuote" hidden></p><div id="pdfStage"><canvas id="pdfCanvas" hidden aria-label="Strona dokumentu PDF"></canvas><div id="pdfHighlights" aria-label="Zaznaczony fragment dokumentu"></div></div></div>
</section>
</main>
<script src="/vendor/markdown-it.min.js"></script>

$('pgNum').addEventListener('change', () => showPage(activeArticle, pageNumber($('pgNum').value, pdf?.numPages) || activePage));
$('prevPage').addEventListener('click', () => showPage(activeArticle, activePage - 1));
$('nextPage').addEventListener('click', () => showPage(activeArticle, activePage + 1));
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (pdf) showPage(activeArticle, activePage, selectedCitation); }, 200); });

    const response = await fetch('/api/docs'); if (!response.ok) throw new Error();

function updateForm() { const busy = !!request; $('newChat').disabled = busy; $('q').disabled = busy; $('queryImage').disabled = busy; $('clearImage').disabled = busy; $('send').disabled = busy || uploading; $('cancelAsk').hidden = !busy; }

function sourceButton(item, className) {

async function readEvents(response, receive) {
  const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer = '';
  function process(final = false) {
    buffer = buffer.replace(/\r\n/g,'\n');
    let boundary;
    while ((boundary = buffer.indexOf('\n\n')) >= 0) { const frame = buffer.slice(0,boundary); buffer = buffer.slice(boundary + 2); parse(frame); }
    if (final && buffer.trim()) { parse(buffer); buffer = ''; }
  }
  function parse(frame) { const data = frame.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n'); if (data) receive(JSON.parse(data)); }
  try { while (true) { const {value,done} = await reader.read(); if (done) break; buffer += decoder.decode(value,{stream:true}); process(); } buffer += decoder.decode(); process(true); }
  finally { reader.releaseLock(); }
}
$('cancelAsk').addEventListener('click', () => request?.abort());
$('q').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); $('composer').requestSubmit(); } });
$('composer').addEventListener('submit', async event => {
  event.preventDefault(); if (request || uploading) return;
  const question = $('q').value.trim(), image = queryImage;
  const history = conversation.map(message => ({...message}));
  const selectedSource = docs.get(activeArticle)?.source_id;
  $('formStatus').textContent = '';
  if (!question && !image) { $('formStatus').textContent = 'Wpisz pytanie lub dodaj obraz.'; $('q').focus(); return; }
  $('welcome')?.remove();
  const turn = make('article','turn'), user = make('div','question',question || 'Pytanie na podstawie obrazu');
  if (image) { const preview = make('img'); preview.src = image; preview.alt = 'Obraz do pytania'; user.append(preview); }
  const responseNode = make('div','response'), status = make('div','status','Wyszukiwanie stron…'), evidence = make('div','evidence-list'), answer = make('div','answer answer-body'), citations = make('div','citations');
  const badge = make('span','topic-badge'); badge.hidden = true;
  const cardHeader = make('div','response-header'); cardHeader.append(badge,status);
  const interpretation = make('div','muted answer'); interpretation.hidden = true;
  function showInterpretation(value) { if (typeof value === 'string' && value.trim() && value !== question) { interpretation.textContent = `Pytanie: ${value}`; interpretation.hidden = false; } }
  status.setAttribute('role','status'); responseNode.append(cardHeader,interpretation,evidence,answer,citations); turn.append(user,responseNode); $('log').append(turn); turn.scrollIntoView({block:'nearest'});
  const controller = new AbortController(); request = controller; updateForm(); let completed = false, failed = false, finalPayload = null;
  try {
    const response = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,query_image:image,history,...(selectedSource ? {selected_source_id:selectedSource} : {})}),signal:controller.signal});
    if (!response.ok) { let detail = ''; try { const body = await response.json(); if (typeof body.detail === 'string') detail = body.detail; } catch {} throw new Error(detail || `Błąd serwera (${response.status}).`); }
    await readEvents(response, frame => {
      if (controller.signal.aborted) return;
      const payload = frame.payload;
      if (frame.kind === 'event' && payload?.type === 'resolving_context') status.textContent = 'Uwzględniam rozmowę…';
      if (frame.kind === 'event' && payload?.type === 'context') showInterpretation(payload.question);
      if (frame.kind === 'event' && payload?.type === 'classification') showClassification(badge,payload);
      if (frame.kind === 'error') { failed = true; throw new Error(typeof payload === 'string' ? payload : 'Nie udało się uzyskać odpowiedzi.'); }
      if (frame.kind === 'event' && payload?.type === 'retrieved') { showEvidence(evidence,payload.pages); status.textContent = 'Znalezione strony · Gemini przygotowuje odpowiedź…'; }
      if (frame.kind === 'event' && payload?.type === 'reranking') status.textContent = 'Jev wybiera strony pasujące do pytania…';
      if (frame.kind === 'event' && payload?.type === 'reading') status.textContent = 'Gemini czyta znalezione strony…';
      if (frame.kind === 'done') {
        if (payload.classification) showClassification(badge,payload.classification);
        completed = true; finalPayload = payload; showInterpretation(payload.resolved_question);
        if (payload.needs_clarification) evidence.replaceChildren(); else if (!evidence.children.length) showEvidence(evidence,payload.pages);
        renderAnswer(answer,payload.answer || 'Nie znaleziono odpowiedzi w dokumentach.'); citations.replaceChildren();
        for (const item of (payload.needs_clarification ? [] : payload.citations || [])) { const button = sourceButton(item,'citation'); if (button) { button.textContent = `${title(item.article_id,item.document)} · s. ${item.page}`; citations.append(button); } }
        const decision = payload.retrieval?.jev;
        status.textContent = decision?.status === 'applied' ? 'Odpowiedź Gemini · strony wybrane z Jev' : decision?.status === 'fallback' ? 'Odpowiedź Gemini · Jev niedostępny, użyto wyników wyszukiwania' : 'Odpowiedź Gemini';
        if (payload.needs_clarification) status.textContent = 'Doprecyzuj pytanie';
      }
    });
    if (!completed && !failed) throw new Error('Połączenie zakończyło się przed otrzymaniem odpowiedzi. Spróbuj ponownie.');
    if (completed && !controller.signal.aborted && !failed) { rememberTurn(finalPayload.resolved_question || question || 'Pytanie na podstawie obrazu', finalPayload.answer || answer.textContent); $('q').value = ''; clearImage(); }
  } catch (error) { status.classList.add('error'); status.textContent = error.name === 'AbortError' ? 'Anulowano. Możesz wysłać pytanie ponownie.' : error.message || 'Nie udało się uzyskać odpowiedzi.'; }
  finally { if (request === controller) { request = null; updateForm(); $('q').focus(); } }
});
loadDocs();
