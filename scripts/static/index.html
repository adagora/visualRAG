<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelRAG — pytania do dokumentów</title>
<style>
:root{color-scheme:light;--bg:#f7f6f3;--paper:#fff;--ink:#242523;--muted:#72736d;--line:#dedfd8;--accent:#42634d}*{box-sizing:border-box}body{margin:0;height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column}header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px}h1{font-size:18px;margin:0}header span,.muted{color:var(--muted);font-size:13px}main{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(0,1.15fr);flex:1;min-height:0}#chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}#log{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px}.empty{margin:auto;color:var(--muted);max-width:330px}.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}.turn{display:grid;gap:12px}.question{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9ede6;border-radius:12px;padding:12px 16px;margin-left:32px}.question img{display:block;max-width:180px;max-height:150px;margin-top:8px;border-radius:6px}.response{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}.status{color:var(--muted);font-size:13px}.status.error{color:#a33329}.answer{white-space:pre-wrap;overflow-wrap:anywhere}.evidence-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.evidence{text-align:left;border:1px solid var(--line);background:var(--bg);padding:0;overflow:hidden;border-radius:7px;min-width:0}.evidence img{display:block;width:100%;height:120px;object-fit:contain;background:#e8e8e3}.evidence span{display:block;padding:6px 8px;font-size:11px;overflow-wrap:anywhere}.citations{display:flex;flex-wrap:wrap;gap:6px}.citation{display:inline-block;font-size:12px;background:#eef2ec;border:1px solid #cbd6c9;border-radius:7px;padding:8px 12px;color:#33553c;text-align:left;text-decoration:none}.citation:hover{border-color:var(--accent);text-decoration:underline}.citation:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--paper);cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#composer{padding:16px 20px;border-top:1px solid var(--line);background:var(--paper)}#q{width:100%;resize:vertical;min-height:85px;max-height:210px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.upload{font-size:13px;cursor:pointer;border:1px solid var(--line);padding:7px 10px;border-radius:7px}#queryImage{width:1px;height:1px;position:absolute;opacity:0}.upload:focus-within{outline:2px solid var(--accent)}#send{margin-left:auto;background:var(--accent);border-color:var(--accent);color:white}#attachment{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px}#attachment[hidden]{display:none}#attachment img{height:48px;width:60px;object-fit:contain;border-radius:4px}#attachmentName{overflow-wrap:anywhere;flex:1}#formStatus{min-height:20px;font-size:12px;color:#a33329;margin-top:4px}#viewer{display:flex;flex-direction:column;min-width:0;min-height:0}.viewer-tools{padding:12px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}#docSel{flex:1;min-width:100px;max-width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}#pgNum{width:64px;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}#pdfArea{overflow:auto;flex:1;padding:22px;background:#e6e7e2;position:relative}#viewerStatus{color:var(--muted);font-size:13px;margin:0 0 12px}#pdfCanvas{display:block;margin:auto;max-width:100%;height:auto;background:white;box-shadow:0 2px 12px #00000018}#pdfCanvas[hidden]{display:none}#openPdf{color:var(--accent);font-size:12px}@media(max-width:800px){body{height:auto;min-height:100dvh}header{padding:12px 16px;flex-wrap:wrap;gap:4px 12px}main{display:flex;flex-direction:column}#chat{height:65dvh;min-height:420px;border-right:0}#viewer{height:70dvh;min-height:400px;border-top:1px solid var(--line)}#log{padding:16px}#composer{padding:12px 16px}#pdfArea{padding:12px}.viewer-tools{padding:10px}header span{font-size:12px}}
</style>
</head>
<body>
<header><h1>PixelRAG</h1><span>Znajdź odpowiedź i sprawdź ją w dokumencie.</span></header>
<main>
<section id="chat" aria-label="Pytania do dokumentów">
<div id="log"><div class="empty" id="welcome"><strong>O co chcesz zapytać?</strong>Wpisz pytanie lub dodaj zrzut ekranu. Zobaczysz znalezione strony i odpowiedź Gemini ze źródłami.</div></div>
<form id="composer">
<label for="q" class="muted">Twoje pytanie</label>
<textarea id="q" placeholder="Np. jakie parametry ma ten produkt?" maxlength="4000"></textarea>
<div id="attachment" hidden><img id="attachmentPreview" alt="Załączony obraz"><span id="attachmentName"></span><button type="button" id="clearImage">Usuń obraz</button></div>
<div class="actions"><label class="upload">Dodaj obraz<input id="queryImage" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Dodaj obraz PNG, JPEG lub WebP"></label><span class="muted">do 5 MB</span><button id="cancelAsk" type="button" hidden>Anuluj</button><button id="send" type="submit">Zapytaj</button></div>
<div id="formStatus" role="status" aria-live="polite"></div>
</form>
</section>
<section id="viewer" aria-label="Podgląd dokumentu PDF">
<div class="viewer-tools"><select id="docSel" aria-label="Dokument" disabled><option>Ładowanie dokumentów…</option></select><button id="prevPage" type="button" aria-label="Poprzednia strona" disabled>←</button><label for="pgNum">Strona</label><input id="pgNum" type="number" min="1" value="1" aria-label="Numer strony" disabled><span id="pageCount">/ —</span><button id="nextPage" type="button" aria-label="Następna strona" disabled>→</button><a id="openPdf" target="_blank" rel="noopener" hidden>Otwórz PDF</a></div>
<div id="pdfArea"><p id="viewerStatus" role="status">Ładowanie dokumentów…</p><canvas id="pdfCanvas" hidden aria-label="Strona dokumentu PDF"></canvas></div>
</section>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const docs = new Map();
let pdfjs, pdf, loadingTask, renderTask, viewerVersion = 0, activeArticle = '', activePage = 1;
let queryImage = null, imageVersion = 0, uploading = false, request = null;
const pdfReady = import('/vendor/pdf.min.mjs').then(module => { pdfjs = module; pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.mjs'; });
pdfReady.catch(() => {});
function make(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
function title(id, fallback) { return docs.get(String(id))?.title || fallback || String(id); }
function pdfUrl(id) { return `/api/pdf/${encodeURIComponent(id)}?source=${encodeURIComponent(docs.get(String(id)).source_id)}`; }
function pageNumber(value, max = Number.MAX_SAFE_INTEGER) { const number = Number(value); return Number.isInteger(number) && number >= 1 && number <= max ? number : null; }
function viewerControls() { const count = pdf?.numPages || 0; $('pgNum').disabled = !count; $('pgNum').max = count || 1; $('pgNum').value = activePage; $('pageCount').textContent = `/ ${count || '—'}`; $('prevPage').disabled = !count || activePage <= 1; $('nextPage').disabled = !count || activePage >= count; }
async function showPage(article, requestedPage = 1) {
  const id = String(article), doc = docs.get(id);
  if (!doc) { $('viewerStatus').textContent = 'Nie znaleziono tego dokumentu.'; return; }
  const version = ++viewerVersion;
  if (renderTask) { renderTask.cancel(); renderTask = null; }
  $('viewerStatus').textContent = 'Ładowanie strony…';
  $('pdfCanvas').hidden = true;
  try {
    await pdfReady;
    if (version !== viewerVersion) return;
    if (activeArticle !== id || !pdf) {
      loadingTask?.destroy().catch(() => {});
      if (pdf) { pdf.destroy().catch(() => {}); pdf = null; }
      activeArticle = id;
      $('docSel').value = id;
      viewerControls();
      const task = pdfjs.getDocument(pdfUrl(id));
      loadingTask = task;
      const loaded = await task.promise;
      if (version !== viewerVersion) { loaded.destroy().catch(() => {}); return; }
      pdf = loaded;
    }
    activePage = Math.min(pageNumber(requestedPage) || 1, pdf.numPages);
    viewerControls();
    $('openPdf').href = `${pdfUrl(id)}#page=${activePage}`;
    $('openPdf').hidden = false;
    const page = await pdf.getPage(activePage);
    if (version !== viewerVersion) return;
    const natural = page.getViewport({scale:1});
    const width = Math.max(200, $('pdfArea').clientWidth - 44);
    const scale = Math.min(width / natural.width, 1.8);
    const viewport = page.getViewport({scale});
    const canvas = make('canvas');
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(viewport.width * ratio); canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = `${viewport.width}px`; canvas.style.height = 'auto';
    const task = page.render({canvasContext:canvas.getContext('2d'), viewport, transform:ratio === 1 ? undefined : [ratio,0,0,ratio,0,0]});
    renderTask = task;
    await task.promise;
    if (version !== viewerVersion) return;
    const target = $('pdfCanvas'); target.width = canvas.width; target.height = canvas.height; target.style.width = canvas.style.width; target.getContext('2d').drawImage(canvas, 0, 0); target.hidden = false;
    $('viewerStatus').textContent = `${doc.title} · strona ${activePage}`;
    $('pdfArea').scrollTop = 0;
  } catch (error) {
    if (version === viewerVersion) $('viewerStatus').textContent = 'Nie udało się wyświetlić PDF. Wybierz dokument ponownie.';
  }
}
$('docSel').addEventListener('change', () => showPage($('docSel').value));
$('pgNum').addEventListener('change', () => showPage(activeArticle, pageNumber($('pgNum').value, pdf?.numPages) || activePage));
$('prevPage').addEventListener('click', () => showPage(activeArticle, activePage - 1));
$('nextPage').addEventListener('click', () => showPage(activeArticle, activePage + 1));
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (pdf) showPage(activeArticle, activePage); }, 200); });
async function loadDocs() {
  try {
    const response = await fetch('/api/docs'); if (!response.ok) throw new Error();
    const data = await response.json(); $('docSel').replaceChildren();
    for (const doc of data.docs || []) { const id = String(doc.article_id); docs.set(id, doc); const option = make('option', '', doc.title || id); option.value = id; $('docSel').append(option); }
    $('docSel').disabled = !docs.size;
    if (docs.size) showPage(docs.keys().next().value); else { $('docSel').append(make('option', '', 'Brak dokumentów')); $('viewerStatus').textContent = 'Brak dokumentów w indeksie.'; }
  } catch { $('docSel').replaceChildren(make('option', '', 'Brak połączenia')); $('viewerStatus').textContent = 'Nie udało się pobrać listy dokumentów. Odśwież stronę, aby spróbować ponownie.'; }
}
function updateForm() { const busy = !!request; $('q').disabled = busy; $('queryImage').disabled = busy; $('clearImage').disabled = busy; $('send').disabled = busy || uploading; $('cancelAsk').hidden = !busy; }
function clearImage() { imageVersion++; queryImage = null; uploading = false; $('queryImage').value = ''; $('attachment').hidden = true; $('attachmentPreview').removeAttribute('src'); $('attachmentName').textContent = ''; updateForm(); }
$('clearImage').addEventListener('click', clearImage);
$('queryImage').addEventListener('change', async () => {
  const file = $('queryImage').files[0]; clearImage(); $('formStatus').textContent = '';
  if (!file) return;
  if (!['image/png','image/jpeg','image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) { $('formStatus').textContent = 'Wybierz obraz PNG, JPEG lub WebP o rozmiarze do 5 MB.'; return; }
  const version = imageVersion; uploading = true; updateForm();
  try {
    const data = await new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
    if (version !== imageVersion) return;
    queryImage = data; $('attachmentPreview').src = data; $('attachmentName').textContent = file.name; $('attachment').hidden = false;
  } catch { if (version === imageVersion) $('formStatus').textContent = 'Nie udało się odczytać obrazu.'; }
  finally { if (version === imageVersion) { uploading = false; updateForm(); } }
});
function sourceButton(item, className) {
  const id = String(item.article_id ?? ''), doc = docs.get(id);
  if (!doc || !doc.source_id || item.source_id !== doc.source_id) return null;
  const page = pageNumber(item.page, Number(doc.pages));
  if (!page) return null;
  const link = className === 'citation';
  const button = make(link ? 'a' : 'button', className);
  if (link) button.href = `${pdfUrl(id)}#page=${page}`; else button.type = 'button';
  button.title = `Otwórz: ${title(id,item.document)}, strona ${page}`;
  button.addEventListener('click', event => {
    if (link && (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)) return;
    event.preventDefault(); showPage(id, page);
    if (matchMedia('(max-width:800px)').matches) $('viewer').scrollIntoView({behavior:'smooth'});
  });
  return button;
}
function showEvidence(container, pages) {
  container.replaceChildren();
  for (const item of (pages || []).slice(0,4)) {
    const button = sourceButton(item, 'evidence'); if (!button) continue;
    const img = make('img'); img.src = `/api/page/${encodeURIComponent(item.article_id)}/${item.page}?source=${encodeURIComponent(docs.get(String(item.article_id)).source_id)}`; img.alt = `Podgląd strony ${item.page}`; img.loading = 'lazy'; img.addEventListener('error', () => { img.alt = 'Podgląd niedostępny — otwórz PDF'; });
    button.append(img, make('span','',`${title(item.article_id,item.document)} · s. ${item.page}`)); container.append(button);
  }
}
async function readEvents(response, receive) {
  const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer = '';
  function process(final = false) {
    buffer = buffer.replace(/\r\n/g,'\n');
    let boundary;
    while ((boundary = buffer.indexOf('\n\n')) >= 0) { const frame = buffer.slice(0,boundary); buffer = buffer.slice(boundary + 2); parse(frame); }
    if (final && buffer.trim()) { parse(buffer); buffer = ''; }
  }
  function parse(frame) { const data = frame.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n'); if (data) receive(JSON.parse(data)); }
  try { while (true) { const {value,done} = await reader.read(); if (done) break; buffer += decoder.decode(value,{stream:true}); process(); } buffer += decoder.decode(); process(true); }
  finally { reader.releaseLock(); }
}
$('cancelAsk').addEventListener('click', () => request?.abort());
$('q').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); $('composer').requestSubmit(); } });
$('composer').addEventListener('submit', async event => {
  event.preventDefault(); if (request || uploading) return;
  const question = $('q').value.trim(), image = queryImage;
  $('formStatus').textContent = '';
  if (!question && !image) { $('formStatus').textContent = 'Wpisz pytanie lub dodaj obraz.'; $('q').focus(); return; }
  $('welcome')?.remove();
  const turn = make('article','turn'), user = make('div','question',question || 'Pytanie na podstawie obrazu');
  if (image) { const preview = make('img'); preview.src = image; preview.alt = 'Obraz do pytania'; user.append(preview); }
  const responseNode = make('div','response'), status = make('div','status','Wyszukiwanie stron…'), evidence = make('div','evidence-list'), answer = make('div','answer'), citations = make('div','citations');
  status.setAttribute('role','status'); responseNode.append(status,evidence,answer,citations); turn.append(user,responseNode); $('log').append(turn); turn.scrollIntoView({block:'nearest'});
  const controller = new AbortController(); request = controller; updateForm(); let completed = false, failed = false;
  try {
    const response = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,query_image:image}),signal:controller.signal});
    if (!response.ok) { let detail = ''; try { const body = await response.json(); if (typeof body.detail === 'string') detail = body.detail; } catch {} throw new Error(detail || `Błąd serwera (${response.status}).`); }
    await readEvents(response, frame => {
      if (controller.signal.aborted) return;
      const payload = frame.payload;
      if (frame.kind === 'error') { failed = true; throw new Error(typeof payload === 'string' ? payload : 'Nie udało się uzyskać odpowiedzi.'); }
      if (frame.kind === 'event' && payload?.type === 'retrieved') { showEvidence(evidence,payload.pages); status.textContent = 'Znalezione strony · Gemini przygotowuje odpowiedź…'; }
      if (frame.kind === 'event' && payload?.type === 'reranking') status.textContent = 'Jev wybiera strony pasujące do pytania…';
      if (frame.kind === 'event' && payload?.type === 'reading') status.textContent = 'Gemini czyta znalezione strony…';
      if (frame.kind === 'done') {
        completed = true; if (!evidence.children.length) showEvidence(evidence,payload.pages);
        answer.textContent = payload.answer || 'Nie znaleziono odpowiedzi w dokumentach.'; citations.replaceChildren();
        for (const item of payload.citations || []) { const button = sourceButton(item,'citation'); if (button) { button.textContent = `${title(item.article_id,item.document)} · s. ${item.page}`; citations.append(button); } }
        const decision = payload.retrieval?.jev;
        status.textContent = decision?.status === 'applied' ? 'Odpowiedź Gemini · strony wybrane z Jev' : decision?.status === 'fallback' ? 'Odpowiedź Gemini · Jev niedostępny, użyto wyników wyszukiwania' : 'Odpowiedź Gemini';
      }
    });
    if (!completed && !failed) throw new Error('Połączenie zakończyło się przed otrzymaniem odpowiedzi. Spróbuj ponownie.');
    if (completed) { $('q').value = ''; clearImage(); }
  } catch (error) { status.classList.add('error'); status.textContent = error.name === 'AbortError' ? 'Anulowano. Możesz wysłać pytanie ponownie.' : error.message || 'Nie udało się uzyskać odpowiedzi.'; }
  finally { if (request === controller) { request = null; updateForm(); $('q').focus(); } }
});
loadDocs();
</script>
</body>
</html>
