[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "try-pixelrag"
version = "0.1.0"
description = "Gemini pixel retrieval over PDF pages, with source citations and a local UI"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "numpy",
    "python-dotenv",
    "pillow",
    "PyMuPDF>=1.24",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.60"]

[project.scripts]
pixelrag-index = "gemini_index:main"
pixelrag-ask = "ask:main"
pixelrag-serve = "app:main"
pixelrag-eval = "evaluate:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["app", "ask", "evaluate", "gemini_index", "index_manifest", "jev", "rag", "visual_query"]

[tool.setuptools.data-files]
"share/pixelrag/static" = ["scripts/static/index.html"]
"share/pixelrag/static/vendor" = ["scripts/static/vendor/pdf.min.mjs", "scripts/static/vendor/pdf.worker.min.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
