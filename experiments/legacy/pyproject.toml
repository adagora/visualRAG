[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "try-pixelrag"
version = "0.1.0"
description = "Visual RAG over technical PDFs — page-level retrieval, hybrid BM25, citations, web UI"
requires-python = ">=3.12"
# Runtime deps are deliberately NOT pinned here. This repo is a thin layer over
# an upstream `pixelrag` install whose extras (index/serve/pdf) drag in torch,
# faiss and transformers with platform-specific wheels; re-declaring them would
# fight `uv pip install 'pixelrag[index,serve,pdf]'` rather than help it.
# See README "Setup". What IS declared is what this layer adds on top.
dependencies = [
    "requests",
    "python-dotenv",
    "numpy",
    "pillow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "PyMuPDF>=1.24",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.60"]
gemini = ["google-genai"]
anthropic = ["anthropic"]
rerank = ["sentence-transformers>=6.0"]

[project.scripts]
pixelrag-ask = "ask:main"
pixelrag-compare = "compare:main"
pixelrag-serve-all = "serve_all:main"
pixelrag-bench = "visual_bench:main"
pixelrag-index = "build_index:main"

# Flat modules under scripts/, not a nested package. `python scripts/ask.py`
# already puts scripts/ on sys.path[0], so this exists to make the same imports
# work from any working directory after `pip install -e .` — and to give the
# dependency graph a declared home instead of leaving it to sys.path accidents.
[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
    "ab_encoder",
    "ablate",
    "answer_all",
    "answer_eval",
    "answer_cache",
    "app",
    "ask",
    "bench_search",
    "bench",
    "build_index",
    "build_text_index",
    "chat_categories",
    "chat_context",
    "check_parity",
    "chunk_multiscale",
    "chunkmeta",
    "citations",
    "citeparse",
    "compare",
    "corpus",
    "encoder",
    "encoder_contract",
    "encoder_device",
    "evidence",
    "evaluate_pl",
    "gemini_index",
    "imagefit",
    "index_manifest",
    "jev",
    "jev_memo",
    "layout",
    "lexical",
    "make_test_pdf",
    "oracle",
    "calibration",
    "pagehit",
    "prepare_hires",
    "profile_search",
    "providers",
    "queryembed",
    "rag",
    "resolution_probe",
    "retrieve",
    "serve_all",
    "search_api",
    "scan_fixture",
    "snip",
    "sweep_encoder",
    "sweep_ranking",
    "tokenise_cache",
    "transcribe",
    "visual_bench",
    "visual_query",
    "visual_rerank",
    "xray",
]

[tool.setuptools.data-files]
"share/pixelrag/static" = ["scripts/static/index.html"]
"share/pixelrag/static/vendor" = ["scripts/static/vendor/pdf.min.mjs", "scripts/static/vendor/pdf.worker.min.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
